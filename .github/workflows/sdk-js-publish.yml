name: SDK-JS Publish to npm

on:
  push:
    tags:
      - "sdk-js-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          cd sdk-js
          npm ci

      - name: Build
        run: |
          cd sdk-js
          npm run build

      - name: Publish orchagent-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd sdk-js
          npm publish --access public

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./sdk-js/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Published orchagent-sdk@$VERSION"
