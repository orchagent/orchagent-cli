name: Publish to npm

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (latest, beta, alpha, etc.)'
        required: false
        default: 'latest'
        type: choice
        options:
          - latest
          - beta
          - alpha
          - next

  # Trigger on version tags (e.g., v0.3.30)
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write  # Required for OIDC authentication with npm

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from tag
        id: get_version
        env:
          GITHUB_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            # Extract version from tag (v0.3.30 -> 0.3.30)
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # Use version from package.json for manual triggers
            VERSION=$(node -p "require('./cli/package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Determine npm tag
        id: npm_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "tag=${INPUT_TAG:-latest}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          cd cli
          npm install

      - name: Build @orchagent/cli
        run: |
          cd cli
          npm run build

      - name: Publish @orchagent/cli
        env:
          NPM_TAG: ${{ steps.npm_tag.outputs.tag }}
        run: |
          cd cli
          npm publish --provenance --access public --tag "$NPM_TAG"

      - name: Sync wrapper version
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          cd cli-wrapper
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish orchagent wrapper
        env:
          NPM_TAG: ${{ steps.npm_tag.outputs.tag }}
        run: |
          cd cli-wrapper
          npm publish --provenance --access public --tag "$NPM_TAG"

      - name: Summary
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          NPM_TAG: ${{ steps.npm_tag.outputs.tag }}
        run: |
          echo "✅ Published successfully!"
          echo ""
          echo "📦 @orchagent/cli@$VERSION"
          echo "📦 orchagent@$VERSION"
          echo ""
          echo "🏷️  Tag: $NPM_TAG"
          echo ""
          echo "Users can now run:"
          echo "  npx orchagent skill install owner/repo"
          echo "  npm install -g @orchagent/cli"
